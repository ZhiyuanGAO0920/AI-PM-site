# 推送 master 后自动构建 + 死链门禁 + 部署到腾讯云 CloudBase 静态托管
# 需要的 GitHub Secrets（repo Settings → Secrets and variables → Actions）：
#   方式 A（推荐，最小权限）：CLOUDBASE_API_KEY —— CloudBase 控制台「环境 → API Key」生成的环境级密钥
#   方式 B（账号级密钥）：CLOUDBASE_SECRET_ID + CLOUDBASE_SECRET_KEY —— 腾讯云 API 密钥管理生成的 SecretId/SecretKey
# 两种方式任选其一，选 A 时注释掉 login 步骤的 B 行、放开 A 行。

name: Deploy to CloudBase

on:
  push:
    branches: [master]
  workflow_dispatch: {} # 支持手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          npm ci
          pip install pillow

      - name: Build
        run: npm run build

      - name: Check internal links (gate)
        run: node scripts/check-links.mjs

      - name: Deploy to CloudBase
        # 认证方式 A：CloudBase 环境 API Key（环境级、最小权限）
        # 仅需 1 个 Secret：CLOUDBASE_API_KEY（环境 API Key 的 JWT token）
        # envId 非机密（站点 URL 已公开），直接字面量，与 cloudbaserc.json 保持一致
        run: |
          npx tcb login --cloudbase-api-key "${{ secrets.CLOUDBASE_API_KEY }}" -e ai-pm-site-d0g2id0usfe50d5ab
          npx tcb hosting deploy dist
